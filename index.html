<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M6F+ gegen Halten</title>
<meta name="description" content="Backtest-Statistiken der Strategie M6F+ für ETH und BTC im Vergleich zum Halten – interaktiv.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610062140">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <div class="seg small" role="radiogroup" aria-label="Sprache / Language" id="lang">
        <button role="radio" data-v="de" aria-checked="true">Deutsch</button>
        <button role="radio" data-v="en" aria-checked="false">English</button>
      </div>
    </div>
    <h1 class="hero-title"><span data-i18n="hero.h1a"></span><br><span class="grad" data-i18n="hero.h1b"></span></h1>
    <p class="hero-sub" data-i18n="lede"></p>
    <div class="big-stats">
      <div class="big"><div class="v grad" data-i18n="stat1.v"></div><div class="l" data-i18n="stat1.l"></div><div class="c" data-i18n="stat1.c"></div></div>
      <div class="big"><div class="v grad" data-i18n="stat2.v"></div><div class="l" data-i18n="stat2.l"></div><div class="c" data-i18n="stat2.c"></div></div>
      <div class="big"><div class="v grad" data-i18n="stat3.v"></div><div class="l" data-i18n="stat3.l"></div><div class="c" data-i18n="stat3.c"></div></div>
    </div>
    <a class="cta" href="#try" data-i18n="cta"></a>
  </div>
</header>

<section class="wrap duel">
  <div class="duel-head">
    <h2 class="duel-title"><span>M6F+</span> <em data-i18n="vs"></em> <span class="muted" data-i18n="hold"></span></h2>
    <div class="cselect" id="since">
      <button type="button" class="cselect-btn" aria-haspopup="listbox" aria-expanded="false"><span class="cselect-val"></span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <ul class="cselect-list" role="listbox" hidden></ul>
    </div>
  </div>
  <div class="duel-rows" id="duel"></div>
</section>

<main class="wrap">
  <h2 class="section" id="try" data-i18n="try.h"></h2>
  <section class="controls" aria-label="Auswahl">
    <div class="seg" role="radiogroup" aria-label="Markt" id="market">
      <button role="radio" data-v="eth" aria-checked="true">ETH</button>
      <button role="radio" data-v="btc" aria-checked="false">BTC</button>
      <button role="radio" data-v="mix" aria-checked="false" data-i18n="mix"></button>
    </div>
    <label class="field"><span data-i18n="start"></span>
      <input type="date" id="start" min="2020-02-01">
    </label>
    <label class="field"><span data-i18n="amount"></span>
      <span class="money"><input type="number" id="amount" value="10000" min="100" step="100" inputmode="numeric"> €</span>
    </label>
    <div class="seg" role="radiogroup" aria-label="Skala" id="scale">
      <button role="radio" data-v="lin" aria-checked="true" data-i18n="linear"></button>
      <button role="radio" data-v="log" aria-checked="false" data-i18n="log"></button>
    </div>
  </section>

  <section class="tiles" id="tiles" aria-live="polite"></section>

  <h2 class="section" data-i18n="equity.section"></h2>
  <section class="card">
    <div class="card-head">
      <h2 data-i18n="equity.h"></h2>
      <div class="legend"><span class="key k1"></span>M6F+ <span class="key k2"></span><span data-i18n="hold"></span></div>
    </div>
    <div class="chart" id="equity"></div>
  </section>

  <h2 class="section" data-i18n="dd.section"></h2>
  <section class="card">
    <div class="card-head">
      <h2 data-i18n="dd.h"></h2>
      <div class="legend"><span class="key k1"></span>M6F+ <span class="key k2"></span><span data-i18n="hold"></span></div>
    </div>
    <div class="chart short" id="drawdown"></div>
  </section>

  <h2 class="section" data-i18n="years.section"></h2>
  <section class="card">
    <div class="card-head">
      <h2 data-i18n="years.h"></h2>
      <div class="legend"><span class="key k1"></span>M6F+ <span class="key k2"></span><span data-i18n="hold"></span></div>
    </div>
    <div class="chart short" id="years"></div>
    <details class="table-view"><summary data-i18n="astable"></summary><div id="years-table"></div></details>
  </section>

  <h2 class="section" data-i18n="starts.section"></h2>
  <section class="card">
    <div class="card-head">
      <h2 data-i18n="starts.h"></h2>
      <div class="seg small" role="radiogroup" aria-label="Anlagedauer" id="horizon">
        <button role="radio" data-v="30" aria-checked="false" data-i18n="h30"></button>
        <button role="radio" data-v="91" aria-checked="false" data-i18n="h91"></button>
        <button role="radio" data-v="182" aria-checked="false" data-i18n="h182"></button>
        <button role="radio" data-v="365" aria-checked="true" data-i18n="h365"></button>
        <button role="radio" data-v="730" aria-checked="false" data-i18n="h730"></button>
      </div>
    </div>
    <p class="note" id="starts-note"></p>
    <div class="starts" id="starts"></div>
    <div class="chart short" id="dist"></div>
  </section>

  <section class="faq">
    <h2 class="section" data-i18n="faq.h"></h2>
    <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
    <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
    <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
    <details><summary data-i18n="faq.q5"></summary><p data-i18n="faq.a5"></p></details>
  </section>

  <section class="fineprint">
    <h2 data-i18n="basis.h"></h2>
    <ul>
      <li data-i18n="basis.1"></li>
      <li data-i18n="basis.2"></li>
    </ul>
  </section>
</main>

<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="data.js?v=202610062140"></script>
<script src="i18n.js?v=202610062140"></script>
<script src="app.js?v=202610062140"></script>
</body>
</html>
